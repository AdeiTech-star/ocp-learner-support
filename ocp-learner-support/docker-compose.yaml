services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
    depends_on:
      - db
    command: python -m app.worker
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocp
      POSTGRES_PASSWORD: ocp_dev_password
      POSTGRES_DB: ocp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: