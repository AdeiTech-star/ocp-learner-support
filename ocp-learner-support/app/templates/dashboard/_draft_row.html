<div class="bg-white border border-slate-200 rounded-lg overflow-hidden"
     id="draft-{{ draft.draft_id }}">
  <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="inline-block px-2 py-0.5 text-xs font-medium bg-amber-100 text-amber-800 rounded">
        {{ draft.nudge_type.replace('_', ' ') }}
      </span>
      <span class="text-sm text-slate-500">
        Learner #{{ draft.user_id }}
      </span>
      <span class="text-sm text-slate-400">·</span>
      <span class="text-sm text-slate-500">
        {{ draft.to_email }}
      </span>
    </div>
    <span class="text-xs text-slate-400">
      {{ draft.created_at.astimezone(local_tz).strftime('%b %d, %H:%M') }}    </span>
  </div>

  <div class="px-5 py-4">
    <p class="text-sm text-slate-500 mb-1">Subject</p>
    <p class="text-base font-medium text-slate-900 mb-4">{{ draft.subject }}</p>

    <p class="text-sm text-slate-500 mb-1">Body</p>
    <div class="prose prose-sm max-w-none bg-slate-50 border border-slate-200 rounded p-4 text-slate-800">
      {{ draft.html_body|safe }}
    </div>
  </div>

<div class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between gap-3"
       data-draft-id="{{ draft.draft_id }}"
       data-to-email="{{ draft.to_email }}">
    <div class="text-xs text-slate-400 font-mono">
      {{ draft.draft_id }}
    </div>
    <div class="flex gap-2 items-center">
      <span class="js-indicator hidden text-sm text-slate-500 mr-2">Sending…</span>
      <button
        type="button"
        data-action="reject"
        class="js-action-btn px-3 py-1.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded hover:bg-slate-100">
        Reject
      </button>
      <button
        type="button"
        data-action="approve"
        class="js-action-btn px-3 py-1.5 text-sm font-medium text-white bg-slate-900 rounded hover:bg-slate-800">
        Approve &amp; send
      </button>
    </div>
  </div>
</div>
