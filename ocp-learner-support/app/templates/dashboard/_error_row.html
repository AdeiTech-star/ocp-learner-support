<div id="draft-{{ draft_id }}"
     class="bg-red-50 border border-red-200 rounded-lg p-4 flex items-start justify-between gap-3">
  <div>
    <p class="text-sm font-medium text-red-900">Action failed</p>
    <p class="text-sm text-red-700 mt-1">{{ message }}</p>
    <p class="text-xs text-red-500 font-mono mt-2">{{ draft_id }}</p>
  </div>
  <button
    type="button"
    onclick="window.location.reload()"
    class="text-sm text-red-700 hover:text-red-900 underline">
    Refresh
  </button>
</div>
